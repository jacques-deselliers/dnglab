name: Build DNGLab 0.8.0 for Windows 7

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-win7:
    runs-on: windows-latest

    steps:
      - name: Get official DNGLab 0.8.0 source
        uses: actions/checkout@v7
        with:
          repository: dnglab/dnglab
          ref: v0.8.0

      - name: Install Rust
        run: |
          rustup toolchain install 1.96.1
          rustup default 1.96.1
          rustup component add rust-src

      - name: Build DNGLab for 64-bit Windows 7
        env:
          RUSTC_BOOTSTRAP: "1"
        run: |
          cargo build --release --locked --package dnglab --target x86_64-win7-windows-msvc -Z build-std

      - name: Calculate SHA256
        shell: cmd
        run: |
          certutil -hashfile target\x86_64-win7-windows-msvc\release\dnglab.exe SHA256 > dnglab-win7-sha256.txt
          type dnglab-win7-sha256.txt

      - name: Upload Windows 7 DNGLab
        uses: actions/upload-artifact@v7
        with:
          name: dnglab-0.8.0-win7-x64
          path: |
            target/x86_64-win7-windows-msvc/release/dnglab.exe
            dnglab-win7-sha256.txt
